name: Build and Release

on:
  push:
    tags:
      - 'v*' # 當 push 以 v 開頭的 tag 時觸發，例如 v1.0.0
  workflow_dispatch: # 支援手動在 GitHub 頁面點選觸發

permissions:
  contents: write # 確保工作流有權限寫入與發布 Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: dist/PDF-Image-Converter.exe
            asset_name: PDF-Image-Converter-Windows.exe
          - os: macos-latest
            artifact_name: PDF-Image-Converter-macOS.zip
            asset_name: PDF-Image-Converter-macOS.zip
          - os: ubuntu-latest
            artifact_name: dist/PDF-Image-Converter
            asset_name: PDF-Image-Converter-Linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install customtkinter pymupdf Pillow tkinterdnd2
          fi
        shell: bash

      - name: Build Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller -F -w --name "PDF-Image-Converter" --icon "app_icon.ico" --add-data "app_icon.ico;." --add-data "app_icon.png;." --add-data "components;components" --add-data "utils;utils" --collect-all tkinterdnd2 pdf_image_toolkit.py

      - name: Build Executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller -F -w --name "PDF-Image-Converter" --icon "app_icon.ico" --add-data "app_icon.ico:." --add-data "app_icon.png:." --add-data "components:components" --add-data "utils:utils" --collect-all tkinterdnd2 pdf_image_toolkit.py
          cd dist
          zip -r ../PDF-Image-Converter-macOS.zip PDF-Image-Converter.app
          cd ..

      - name: Build Executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller -F --name "PDF-Image-Converter" --add-data "app_icon.ico:." --add-data "app_icon.png:." --add-data "components:components" --add-data "utils:utils" --collect-all tkinterdnd2 pdf_image_toolkit.py

      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv dist/PDF-Image-Converter.exe ./PDF-Image-Converter-Windows.exe
        shell: bash

      - name: Prepare Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist/PDF-Image-Converter ./PDF-Image-Converter-Linux
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.os == 'macos-latest' && 'PDF-Image-Converter-macOS.zip' || matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/PDF-Image-Converter-Windows.exe
            **/PDF-Image-Converter-macOS.zip
            **/PDF-Image-Converter-Linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
